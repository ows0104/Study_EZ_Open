# 이 파일은 패키지 빌드용이 아니다. 린터 설정 한 곳으로만 쓴다.
# (`[build-system]` 이 없으므로 빌드 도구가 이 저장소를 패키지로 보지 않는다.)

[tool.pytest.ini_options]
# 검사가 덩이별 폴더로 나뉘어 있다 — `tests/quizgen/` · `runner/` · `spotter/` · `bridge/`.
# 덩이 하나만 돌릴 수 있게 하는 것이 나눈 이유다.
#
#     pytest tests                전부 (606개)
#     pytest tests/spotter        땡시만
#
# `pythonpath` 가 없으면 **`pytest tests` 가 57개 수집 오류로 죽는다.** 검사들이
# `import quizgen` 을 하는데 pytest 는 테스트 파일의 폴더만 sys.path 에 넣고
# 저장소 루트는 안 넣기 때문이다. `python -m pytest` 로는 되고(cwd 가 들어간다)
# 맨 `pytest` 로는 안 되는 차이였고, 문서는 맨 `pytest tests` 라고 적고 있었다.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100          # 실측 p99.5 가 100자였다. 코드가 이미 그렇게 쓰여 있다.
target-version = "py311"

# `server/` 는 자기 루트다 — `from app.config import ...` 로 임포트한다.
# 이걸 적어 주지 않으면 isort 가 `app` 을 서드파티로 오해해 순서를 뒤집는다.
# `spotter/scripts/` 도 자기 루트다 — 서로를 `from generate_exam import ...` 로 부른다.
src = [".", "server", "spotter/scripts"]

exclude = [
    "out", "runs", "필기",
    ".tmp_uv_cache", ".tmp_card_review", ".pytest_cache",
    "node_modules", "web",
    # 땡시 배포본. 산출물이라 사람이 고칠 자리가 아니다.
    "spotter-dist",
    # 땡시 원본 자료가 쌓이는 곳. 추적하지 않는다.
    "spotter/build", "spotter/images", "spotter/기생충학",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

# E501(줄 길이)은 켜지 않는다. ruff 는 한글을 폭 2로 세는데 이 저장소는 주석이
# 한글 산문이라, 100자로 걸면 181줄이 울리고 그 대부분이 "왜 그런가"를 적어 둔
# 문장이다. CLAUDE.md 가 세워 둔 서술 방식과 싸우는 규칙이라 뺀다.
# 길이는 line-length 로 포매터에만 알려 준다.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 의존성 주입은 기본 인자에서 호출하는 것이 정상 관용이다.
# 이걸 적지 않으면 B008 이 67건 울리는데 전부 라우트 시그니처다.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# 테스트는 픽스처를 재정의하거나 임포트만 해 두는 일이 있다.
"tests/**" = ["F811"]
"server/tests/**" = ["F811"]
