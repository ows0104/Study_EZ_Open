<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660">
  <rect width="960" height="660" fill="#fff"/>
  <rect width="960" height="12" fill="#3157a6"/>
  <g font-family="sans-serif" fill="#182238">
    <text x="64" y="100" font-size="36" font-weight="700">개념을 구별하는 기준</text>
    <text x="64" y="148" font-size="22" fill="#65718a">강의 흐름과 개념 구별 · 참고 자료</text>
    <rect x="64" y="202" width="832" height="178" rx="14" fill="#edf2fc"/>
    <text x="98" y="260" font-size="26" font-weight="700">같은 결과라도 조건은 다를 수 있다</text>
    <text x="98" y="314" font-size="23">조건 → 과정 → 결과를 연결해서 비교하기</text>
    <text x="64" y="447" font-size="25" font-weight="700">문제에서 확인할 것</text>
    <text x="84" y="498" font-size="23">① 두 개념의 차이를 만드는 조건</text>
    <text x="84" y="545" font-size="23">② 조건이 달라지면 달라지는 결과</text>
    <text x="866" y="620" font-size="18" fill="#65718a">12</text>
  </g>
</svg>
