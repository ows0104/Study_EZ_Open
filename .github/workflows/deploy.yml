name: Test and deploy

on:
  # Draft PRs do not run CI (check locally while drafting). Marking the PR ready for review runs it.
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

# A newer push to the same PR cancels the older PR run. master pushes and manual runs
# each get their own group (run_id), so no master check or deploy is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide what this run needs (scripts/ci_scope.py): docs/runs-only changes skip the full checks,
  # Windows checks run only when runner/generator/contract/script paths change, and a master merge whose
  # tree equals the already-passed PR head is not re-tested. Unsure -> run everything.
  scope:
    name: Decide checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      windows: ${{ steps.scope.outputs.windows }}
      map: ${{ steps.scope.outputs.map }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_scope.py
          sparse-checkout-cone-mode: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py
  # Linux: the server runs on Linux (Cloud Run) and Linux runners are faster than Windows ones
  # (while the repository was private, a Windows minute also counted twice). Everything that is
  # not Windows-bound runs here.
  checks:
    name: Tests and build
    needs: scope
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.scope.outputs.tests == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python test dependencies
        # map_numbers --check collects pytest, so docs-only runs need these too.
        if: needs.scope.outputs.tests == 'true' || needs.scope.outputs.map == 'true'
        run: python -m pip install -r requirements.txt pytest httpx PyYAML requests
      - name: Install web dependencies
        if: needs.scope.outputs.tests == 'true'
        run: npm --prefix web ci
      - name: Install server dependencies
        if: needs.scope.outputs.tests == 'true'
        working-directory: server
        run: python -m pip install -r requirements.txt
      - name: Python regression and contracts
        if: needs.scope.outputs.tests == 'true'
        # Windows-bound files run in the windows-runner job below.
        run: >-
          python -m pytest tests -q
          --ignore=tests/runner
          --ignore=tests/development/test_server_deploy.py
      - name: Server tests (one process per file, isolated local databases)
        if: needs.scope.outputs.tests == 'true'
        working-directory: server
        run: python -m tests
      - name: Web typecheck and build
        if: needs.scope.outputs.tests == 'true'
        run: npm --prefix web run build
      - name: Bridge and deployment gate tests
        if: needs.scope.outputs.tests == 'true'
        run: node --test tests/bridge/*.cjs web/tests/wait-for-api.test.mjs
      - name: Map and document check
        if: needs.scope.outputs.map == 'true'
        run: python scripts/map_numbers.py --check
      - name: Prepare fixed server candidate
        shell: pwsh
        run: |
          ./server/prepare-build.ps1 -Destination "$env:RUNNER_TEMP/studyez-server"
          python scripts/ci_deploy.py seal --artifact "$env:RUNNER_TEMP/studyez-server" --receipt "$env:RUNNER_TEMP/candidate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-${{ github.sha }}
          path: |
            ${{ runner.temp }}/studyez-server
            ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 14
  # Windows: the local runner, its desktop windows and shortcut, and the manual server/deploy.ps1
  # all run on the operator's Windows PC. Only those checks stay on the (2x-billed) Windows runner.
  windows-runner:
    name: Windows runner checks
    needs: scope
    if: needs.scope.outputs.windows == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Create the project Python environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Windows shortcut environment
        shell: powershell
        run: |
          Get-Content -LiteralPath .venv/pyvenv.cfg
          $shortcutCheck = Join-Path $env:RUNNER_TEMP 'studyez-shortcut-check'
          New-Item -ItemType Directory -Force -Path $shortcutCheck | Out-Null
          ./scripts/install-runner-desktop.ps1 -Destination $shortcutCheck
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest httpx PyYAML requests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Runner, desktop and deploy-script tests
        run: |
          python -m pytest tests/runner tests/development/test_server_deploy.py tests/studyez_llm/test_codex.py -q --ignore=tests/runner/test_desktop_window.py --ignore=tests/runner/test_status_window.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/runner/test_desktop_window.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/runner/test_status_window.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  deploy:
    name: Deploy production API
    needs: [scope, checks, windows-runner]
    # A skipped Windows job (no Windows paths changed / same tree already passed) does not block deploy.
    if: >-
      always() && needs.scope.result == 'success' && needs.checks.result == 'success'
      && (needs.windows-runner.result == 'success' || needs.windows-runner.result == 'skipped')
      && github.repository == 'ows0104/Study_EZ_Open' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studyez-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download the tested candidate from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "server-$GITHUB_SHA" --dir "$RUNNER_TEMP/candidate"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: meddeck-503318
      - name: Deploy exact candidate, verify traffic and read-only health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_deploy.py deploy --artifact "$RUNNER_TEMP/candidate/studyez-server" --receipt "$RUNNER_TEMP/candidate/candidate.json" --output "$RUNNER_TEMP/deployment.json"
      - name: Preserve deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment.json
          if-no-files-found: warn
          retention-days: 30
